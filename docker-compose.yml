services:
  # Definimos nuestro primer y único servicio (La API)
  api-iot:
    build: .
    container_name: servidor-iot
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/telemetria.db
    volumes:
      - telemetry_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  telemetry_data:
